name: Build and Publish Demo Site

on:
  push:
    branches:
    - master
    # Its own pushes only touch docs/, and deploy-key pushes trigger workflows
    paths-ignore:
    - 'docs/**'
concurrency:
  group: master-push
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        # A deploy key on the master ruleset's bypass list, so the push isn't rejected
        ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json
    - name: dotnet publish 
      run: |
        cd demo
        dotnet publish -c Release
        rm -rf ../docs/_framework
        cp -Rv ./bin/Release/net10.0/publish/wwwroot/* ../docs/
    - name: git commit
      run: |
        git config user.name $GITHUB_ACTOR
        git config user.email gh-actions-${GITHUB_ACTOR}@github.com
        git add -A && git commit -m "Build demo site" 
        git push origin HEAD:master
